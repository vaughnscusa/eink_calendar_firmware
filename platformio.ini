; PlatformIO project config
; Board: ESP32 (Waveshare e-Paper ESP32 Driver Board)
; Open this folder in VS Code with the PlatformIO extension installed.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    zinggjm/GxEPD2 @ ^1.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
